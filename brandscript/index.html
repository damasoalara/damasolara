<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

<meta name="description" content="Private.">

<meta property="og:title" content="Damaso Lara · Brandscript">
<meta property="og:description" content="Private. Password required.">
<meta property="og:image" content="https://damasolara.com/brandscript/og-brandscript-a.jpg">
<meta property="og:image:width" content="1200">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Damaso's own palette, from damasolara.com: paper, blush, navy ink, antique gold, olive. */
:root {
  --paper: #F4F4F4;
  --paper-2: #ECEAE6;
  --blush: #EEDBCD;
  --ink: #192231;
  --ink-2: #2A3445;
  --olive: #404A42;
  --gold: #C0B283;
  --grey: #5C636E;
  --line: rgba(25, 34, 49, 0.14);
  --line-light: rgba(244, 244, 244, 0.22);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --gut: clamp(20px, 5vw, 72px);
  --max: 1240px;
  --radius: 22px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
html.rm { scroll-behavior: auto; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-size: 18px;
  line-height: 1.55;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; }
a { color: inherit; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gut); }
.label {
  font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
}
.muted { color: var(--grey); }

/* ---------- Progress line ---------- */
.progress {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50;
  background: transparent; pointer-events: none;
}
.progress i {
  display: block; height: 100%; width: 100%; background: var(--gold);
  transform-origin: 0 50%; transform: scaleX(0);
}

/* ---------- Top bar (appears after the hero) ---------- */
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 12px) var(--gut) 12px;
  background: rgba(244, 244, 244, 0.86);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
  transform: translateY(-110%); transition: transform 0.5s var(--ease);
}
.bar.show { transform: none; }
.bar__name { font-weight: 600; letter-spacing: -0.02em; }
.bar__chap { font-size: 14px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar__chap b { color: var(--ink); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }

/* ---------- Hero ---------- */
.hero {
  position: relative; min-height: 100svh; color: var(--paper);
  display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 22px) var(--gut) calc(env(safe-area-inset-bottom) + 34px);
  overflow: hidden; background: var(--ink);
}
.hero__img { position: absolute; inset: 0; }
.hero__img img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; transform: scale(1.06); transition: transform 2.4s var(--ease); }
.js .hero.in .hero__img img { transform: scale(1); }
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(25,34,49,0.5) 0%, rgba(25,34,49,0) 26%, rgba(25,34,49,0.1) 45%, rgba(25,34,49,0.78) 72%, rgba(25,34,49,0.94) 100%);
}
.hero > *:not(.hero__img) { position: relative; z-index: 1; }
.hero__top { display: flex; justify-content: space-between; align-items: center; }
.hero__top .label { opacity: 0.9; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid rgba(244,244,244,0.5); border-radius: 999px; padding: 6px 12px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.hero__title { margin-top: auto; padding-top: 40px; }
.hero__title .label { color: var(--gold); display: block; margin-bottom: 18px; }
.hero h1 {
  font-size: clamp(56px, 13vw, 184px); line-height: 0.88; font-weight: 700; letter-spacing: -0.055em;
}
.hero__sub {
  margin-top: 22px; font-size: clamp(19px, 2.2vw, 26px); line-height: 1.3; max-width: 24ch; font-weight: 400;
  color: rgba(244,244,244,0.92);
}
.hero__foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 34px; padding-top: 20px; border-top: 1px solid rgba(244,244,244,0.22); }
.hero__foot p { font-size: 14px; color: rgba(244,244,244,0.78); }
.cue { width: 1px; height: 54px; background: rgba(244,244,244,0.35); position: relative; overflow: hidden; }
.cue::after { content: ""; position: absolute; left: 0; top: -40%; width: 1px; height: 40%; background: var(--paper); }
.js:not(.rm) .cue::after { animation: cue 2.2s var(--ease) infinite; }
@keyframes cue { to { top: 100%; } }

/* ---------- Reveal ---------- */
.js:not(.rm) .rv { opacity: 0; transform: translateY(26px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
.js:not(.rm) .rv.in { opacity: 1; transform: none; }

/* ---------- Intro ---------- */
.intro { padding: clamp(80px, 12vw, 160px) 0 clamp(60px, 8vw, 110px); }
.intro__grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
.intro h2 { font-size: clamp(32px, 5vw, 60px); line-height: 1.02; letter-spacing: -0.045em; font-weight: 600; max-width: 16ch; }
.intro p { font-size: clamp(18px, 1.6vw, 21px); max-width: 38ch; }
.intro p + p { margin-top: 1em; }
.cast { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.cast div { border-radius: var(--radius); padding: 22px 20px 20px; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
.cast div:first-child { background: var(--ink); color: var(--paper); }
.cast div:last-child { background: var(--blush); }
.cast strong { font-size: clamp(26px, 3.4vw, 40px); line-height: 1; letter-spacing: -0.04em; font-weight: 600; }
.cast span { font-size: 15px; opacity: 0.8; }
@media (min-width: 900px) {
  .intro__grid { grid-template-columns: 1.1fr 1fr; gap: 64px; align-items: end; }
}

/* ---------- The one-liner (word paint) ---------- */
.oneliner { background: var(--ink); color: var(--paper); padding: clamp(90px, 14vw, 190px) 0; }
.oneliner .label { color: var(--gold); margin-bottom: 30px; display: block; }
.oneliner p {
  font-size: clamp(34px, 6.2vw, 92px); line-height: 1.02; letter-spacing: -0.05em; font-weight: 600; max-width: 18ch;
}
.oneliner p .w { transition: color 0.4s linear; }
.js:not(.rm) .oneliner p .w { color: rgba(244,244,244,0.16); }
.js:not(.rm) .oneliner p .w.on { color: var(--paper); }
.oneliner p em { font-style: normal; color: var(--gold) !important; }
.js:not(.rm) .oneliner p em.w:not(.on) { color: rgba(192,178,131,0.25) !important; }
.oneliner small { display: block; margin-top: 40px; font-size: 15px; color: rgba(244,244,244,0.6); max-width: 40ch; }

/* ---------- Chapters ---------- */
.chapters { padding: clamp(40px, 6vw, 80px) 0 0; }
.chap {
  display: grid; grid-template-columns: 1fr; gap: 22px;
  padding: clamp(64px, 9vw, 120px) 0; border-top: 1px solid var(--line);
  scroll-margin-top: 64px;
}
.chap__head { align-self: start; }
.chap__n { font-size: clamp(64px, 10vw, 140px); line-height: 0.82; font-weight: 700; letter-spacing: -0.06em; color: var(--gold); font-variant-numeric: tabular-nums; }
.chap__t { margin-top: 14px; font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
.chap__q { margin-top: 6px; font-size: 16px; color: var(--grey); max-width: 24ch; }
.chap h3 { font-size: clamp(30px, 4.4vw, 56px); line-height: 1.04; letter-spacing: -0.045em; font-weight: 600; max-width: 20ch; }
.chap .lede { margin-top: 18px; font-size: clamp(18px, 1.5vw, 20px); max-width: 44ch; }
@media (min-width: 900px) {
  .chap { grid-template-columns: 300px 1fr; gap: 56px; }
  .chap__head { position: sticky; top: 96px; }
}

/* Cards */
.pair { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 34px; }
@media (min-width: 640px) { .pair { grid-template-columns: 1fr 1fr; } }
.card { border-radius: var(--radius); padding: 26px 24px; background: var(--paper-2); }
.card .label { color: var(--grey); }
.card h4 { margin-top: 12px; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.12; letter-spacing: -0.035em; font-weight: 600; }
.card p { margin-top: 10px; font-size: 17px; color: var(--ink-2); }

/* Problem: three layers, getting deeper */
.depth { margin-top: 34px; display: grid; gap: 10px; }
.layer { border-radius: var(--radius); padding: 28px 24px 26px; display: grid; gap: 10px; }
.layer:nth-child(1) { background: var(--blush); }
.layer:nth-child(2) { background: var(--olive); color: var(--paper); }
.layer:nth-child(3) { background: var(--ink); color: var(--paper); }
.layer .label { opacity: 0.75; }
.layer p { font-size: clamp(21px, 2.3vw, 28px); line-height: 1.2; letter-spacing: -0.03em; font-weight: 500; max-width: 30ch; }
.layer:nth-child(3) p { color: var(--gold); }
@media (min-width: 900px) {
  .layer { grid-template-columns: 200px 1fr; align-items: baseline; padding: 34px 32px; }
  .layer:nth-child(2) { margin-left: 28px; }
  .layer:nth-child(3) { margin-left: 56px; }
}

/* Guide */
.guide { display: grid; gap: 22px; margin-top: 34px; grid-template-columns: 1fr; }
.guide__photo { border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 5; background: var(--paper-2); max-width: 420px; }
.guide__photo img { width: 100%; height: 100%; object-fit: cover; }
.quote { font-size: clamp(22px, 2.4vw, 30px); line-height: 1.22; letter-spacing: -0.03em; font-style: italic; font-weight: 400; max-width: 26ch; }
.quote + .muted { margin-top: 12px; font-size: 14px; }
.record { margin-top: 30px; border-top: 1px solid var(--line); list-style: none; }
.record li { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 15px 2px; border-bottom: 1px solid var(--line); }
.record li span:first-child { font-weight: 500; }
.record li span:last-child { color: var(--grey); font-size: 15px; text-align: right; }
.ask { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 2px 8px; vertical-align: 2px; }
.empathy { margin-top: 26px; }
.empathy h4 { font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grey); margin-bottom: 10px; }
@media (min-width: 900px) {
  .guide { grid-template-columns: 0.9fr 1.1fr; gap: 48px; align-items: start; }
}

/* Plan */
.steps { list-style: none; margin-top: 34px; counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; position: relative; border-radius: var(--radius); background: var(--paper-2); padding: 26px 24px 26px 86px; }
.steps li::before {
  content: counter(s); position: absolute; left: 24px; top: 22px;
  width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--paper);
  display: grid; place-items: center; font-weight: 600; font-size: 18px;
}
.steps h4 { font-size: clamp(21px, 2.2vw, 26px); letter-spacing: -0.03em; font-weight: 600; line-height: 1.15; }
.steps p { margin-top: 6px; color: var(--ink-2); font-size: 17px; }
@media (min-width: 1000px) {
  .steps { grid-template-columns: repeat(3, 1fr); }
  .steps li { padding: 86px 26px 28px; min-height: 260px; }
  .steps li::before { top: 26px; }
}

/* CTA */
.ctas { display: grid; gap: 10px; margin-top: 34px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .ctas { grid-template-columns: 1fr 1fr; } }
.cta { border-radius: var(--radius); padding: 26px 24px; display: flex; flex-direction: column; gap: 22px; justify-content: space-between; min-height: 200px; }
.cta--direct { background: var(--ink); color: var(--paper); }
.cta--soft { background: var(--blush); }
.cta .label { opacity: 0.75; }
.cta p { font-size: 17px; }
.pill {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
  border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: 16px; text-decoration: none;
  transition: transform 0.3s var(--ease), background 0.3s;
}
.cta--direct .pill { background: var(--paper); color: var(--ink); }
.cta--soft .pill { background: var(--ink); color: var(--paper); }
.pill:hover { transform: translateX(4px); }
.pill::after { content: "\2192"; }

/* Stakes / success switch */
.switch { margin-top: 34px; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 4px; position: relative; }
.seg button {
  position: relative; z-index: 1; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 600;
  padding: 10px 18px; border-radius: 999px; cursor: pointer; color: var(--grey); transition: color 0.3s;
}
.seg button[aria-selected="true"] { color: var(--paper); }
.seg i { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; border-radius: 999px; background: var(--ink); transition: transform 0.5s var(--ease), width 0.5s var(--ease); }
.panes { display: grid; margin-top: 16px; }
.pane { grid-area: 1 / 1; align-self: start; border-radius: var(--radius); overflow: hidden; display: grid; transition: opacity 0.5s var(--ease); }
.pane[hidden] { display: grid; opacity: 0; visibility: hidden; pointer-events: none; }
.pane__body { padding: 28px 24px 30px; }
.pane--fail { background: var(--olive); color: var(--paper); }
.pane--win { background: var(--ink); color: var(--paper); }
.pane--win .pane__img { aspect-ratio: 16 / 9; }
.pane__img img { width: 100%; height: 100%; object-fit: cover; }
.pane h4 { font-size: clamp(24px, 2.8vw, 34px); letter-spacing: -0.04em; font-weight: 600; line-height: 1.08; }
.pane ul { list-style: none; margin-top: 18px; display: grid; gap: 12px; }
.pane li { padding-left: 26px; position: relative; font-size: 18px; line-height: 1.35; }
.pane li::before { content: ""; position: absolute; left: 0; top: 0.55em; width: 12px; height: 1px; background: currentColor; opacity: 0.7; }
.pane--win li::before { background: var(--gold); opacity: 1; }
.pane--fail .pane__img { display: none; }
@media (min-width: 900px) {
  .seg { display: none; }
  .panes { grid-template-columns: 1fr 1.25fr; gap: 10px; margin-top: 0; }
  .pane { grid-area: auto; }
  .pane[hidden] { opacity: 1; visibility: visible; pointer-events: auto; }
  .pane--win { grid-template-columns: 1fr; }
  .pane__body { padding: 34px 32px 36px; }
}
.no-js-note { display: none; }

/* ---------- Voice ---------- */
.voice { background: var(--blush); padding: clamp(80px, 12vw, 150px) 0; }
.voice h2, .pillars h2, .next h2 { font-size: clamp(36px, 6vw, 80px); line-height: 0.98; letter-spacing: -0.05em; font-weight: 600; max-width: 14ch; }
.voice .lede, .pillars .lede { margin-top: 18px; font-size: clamp(18px, 1.5vw, 20px); max-width: 44ch; }
.rules { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 44px; }
@media (min-width: 640px) { .rules { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .rules { grid-template-columns: repeat(4, 1fr); } }
.rule { background: rgba(244,244,244,0.6); border-radius: var(--radius); padding: 24px 22px; }
.rule h4 { font-size: 22px; letter-spacing: -0.03em; font-weight: 600; line-height: 1.1; }
.rule p { margin-top: 8px; font-size: 16px; color: var(--ink-2); }
.swaps { margin-top: 44px; display: grid; gap: 10px; }
.swap { display: grid; grid-template-columns: 1fr; border-radius: var(--radius); overflow: hidden; background: var(--paper); }
.swap > div { padding: 20px 22px; }
.swap .not { color: var(--grey); border-bottom: 1px solid var(--line); }
.swap .not s { text-decoration-thickness: 1px; text-decoration-color: rgba(92,99,110,0.7); }
.swap .yes { font-size: clamp(19px, 1.9vw, 23px); letter-spacing: -0.025em; font-weight: 500; }
.swap .label { display: block; margin-bottom: 6px; font-size: 11px; color: var(--grey); }
.swap .yes .label { color: var(--olive); }
@media (min-width: 900px) {
  .swap { grid-template-columns: 1fr 1.4fr; }
  .swap .not { border-bottom: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; }
}

/* ---------- Pillars ---------- */
.pillars { padding: clamp(80px, 12vw, 150px) 0; }
.grid4 { margin-top: 44px; display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid4 { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .grid4 { grid-template-columns: repeat(4, 1fr); } }
.pillar { position: relative; border-radius: var(--radius); overflow: hidden; min-height: 440px; color: var(--paper); display: flex; flex-direction: column; justify-content: flex-end; background: var(--ink); }
.pillar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.pillar:hover img { transform: scale(1.04); }
.pillar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(25,34,49,0) 25%, rgba(25,34,49,0.92) 100%); }
.pillar > div { position: relative; z-index: 1; padding: 24px 22px; }
.pillar .label { color: var(--gold); }
.pillar h4 { margin-top: 8px; font-size: 32px; letter-spacing: -0.045em; font-weight: 600; line-height: 1; }
.pillar p { margin-top: 10px; font-size: 16px; color: rgba(244,244,244,0.88); }
.pillar ul { list-style: none; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.pillar li { font-size: 13px; border: 1px solid var(--line-light); border-radius: 999px; padding: 4px 10px; }
.pillar li.open { border-style: dashed; color: rgba(244,244,244,0.7); }

/* ---------- Next ---------- */
.next { background: var(--ink); color: var(--paper); padding: clamp(80px, 12vw, 150px) 0 calc(env(safe-area-inset-bottom) + 60px); }
.next .label { color: var(--gold); display: block; margin-bottom: 22px; }
.next .lede { margin-top: 18px; font-size: clamp(18px, 1.5vw, 20px); max-width: 42ch; color: rgba(244,244,244,0.85); }
.qs { list-style: none; margin-top: 44px; border-top: 1px solid var(--line-light); counter-reset: q; }
.qs li { counter-increment: q; display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 22px 0; border-bottom: 1px solid var(--line-light); font-size: clamp(20px, 2vw, 26px); line-height: 1.25; letter-spacing: -0.03em; }
.qs li::before { content: "0" counter(q); color: var(--gold); font-size: 14px; letter-spacing: 0.04em; padding-top: 0.45em; font-variant-numeric: tabular-nums; }
.sign { margin-top: 64px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.sign p { font-size: clamp(28px, 3.6vw, 44px); letter-spacing: -0.045em; font-weight: 600; line-height: 1.05; max-width: 18ch; }
.sign small { font-size: 14px; color: rgba(244,244,244,0.6); }

/* ---------- Gate ---------- */
.gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: var(--ink); color: var(--paper); opacity: 0; transition: opacity 0.4s var(--ease); }
.gate.ready { opacity: 1; }
.gate__bg { position: absolute; inset: 0; background: url("/images/brandscript/hero-879-dusk.jpg") center 60% / cover no-repeat; opacity: 0.35; }
.gate__bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(25,34,49,0.4), rgba(25,34,49,0.92)); }
.gate__card { position: relative; width: 100%; max-width: 400px; }
.gate__card .label { color: var(--gold); display: block; margin-bottom: 14px; }
.gate__card h1 { font-size: clamp(44px, 12vw, 64px); line-height: 0.92; letter-spacing: -0.055em; font-weight: 700; }
.gate__card p { margin-top: 14px; color: rgba(244,244,244,0.8); font-size: 16px; }
.gate form { margin-top: 30px; display: grid; gap: 12px; }
.gate input[type=password] { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--paper); border: 0; border-radius: 999px; padding: 15px 20px; outline: none; }
.gate input[type=password]:focus-visible { box-shadow: 0 0 0 3px var(--gold); }
.gate button { font: inherit; font-weight: 600; font-size: 16px; border: 0; border-radius: 999px; padding: 15px 20px; background: var(--gold); color: var(--ink); cursor: pointer; }
