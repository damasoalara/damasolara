<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="only light">
<title>Private</title>
<meta name="theme-color" content="#F4F4F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
<style>/* Damaso Lara, content calendar. Apple's guidelines on the page and its controls; his brand
   (Schibsted Grotesk, his palette) on the posts themselves. Adapted from Drew's. */
:root{
  /* Damaso's palette, from damasolara.com */
  --navy:#192231;--paper:#F4F4F4;--blush:#EEDBCD;--gold:#C0B283;--olive:#404A42;
  --ink:#192231;--muted:#5C636E;--line:rgba(25,34,49,.12);--card:#FFFFFF;
  --ask:#6B5A22;--ask-bg:#F3ECD6;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --sysd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --brand:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r-card:16px;--r-btn:14px;--r-chip:10px;
  --shadow:0 1px 2px rgba(25,34,49,.06),0 4px 14px rgba(25,34,49,.06);
  --pad:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(192,178,131,.7);outline-offset:2px}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sys);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
a{color:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(var(--pad),env(safe-area-inset-right)) 0 max(var(--pad),env(safe-area-inset-left))}
.ask{display:block;background:var(--ask-bg);color:var(--ask);font-family:var(--sys);font-weight:500;padding:12px 14px;margin:10px 0;font-size:16px;line-height:1.45;border-radius:12px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.press{transition:transform .15s ease,background-color .15s ease}
.press:active{transform:scale(.98)}

/* month */
header.top{padding:max(28px,env(safe-area-inset-top)) 0 20px;display:flex;flex-direction:column;gap:26px}
header.top h1{font-family:var(--sysd);font-weight:700;font-size:clamp(40px,7vw,64px);line-height:1.04;letter-spacing:-.025em}
.count{color:var(--muted);font-size:17px;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:15px;color:var(--muted);padding:0 0 18px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:var(--c);box-shadow:inset 0 0 0 1px rgba(31,34,34,.14)}

.cal{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-size:13px;font-weight:600;color:var(--muted);padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.day{min-height:128px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.day:nth-child(7n){border-right:0}
.day.last{border-bottom:0}
.day.out .d{opacity:.35}
.day .d{font-size:15px;font-weight:600;color:var(--ink);padding:0 2px 2px}
.day.weekend .d{color:var(--muted)}
.chip{display:grid;grid-template-columns:10px minmax(0,1fr);gap:7px;align-items:start;width:100%;min-height:44px;text-align:left;font-size:14px;line-height:1.25;font-weight:600;padding:9px 10px;border-radius:var(--r-chip);text-decoration:none;color:var(--ink);background:var(--paper)}
.chip .dot{margin-top:4px;width:8px;height:8px}
.chip small{display:none;font-weight:500;font-size:13px;color:var(--muted);margin-bottom:2px}
.legend .k-letter{border-radius:3px;width:14px}
.chip:hover{background:#E6E2DB}
.chip.c-email{background:var(--navy);color:#fff}
.chip.c-email small{color:rgba(255,255,255,.82)}
.chip.c-email .dot{background:#fff}
.chip.c-email:hover{background:#173E4A}
.chip.c-plan{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(31,34,34,.22)}
.chip.c-plan:hover{background:rgba(31,34,34,.04)}
.list{display:none}
@media(max-width:899px){
  .grid{display:none}
  .list{display:block}
  .lday{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .lday:last-child{border-bottom:0}
  .lday .d{font-family:var(--sysd);font-weight:600;font-size:28px;line-height:1;padding-top:8px}
  .lday .d small{display:block;font-family:var(--sys);font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
  .lday .items{display:flex;flex-direction:column;gap:8px}
  .chip{font-size:17px;padding:12px 14px;min-height:56px;border-radius:12px;grid-template-columns:10px minmax(0,1fr);gap:10px}
  .chip .dot{width:10px;height:10px;margin-top:6px}
  .chip small{display:block}
}
footer{color:var(--muted);font-size:15px;padding:24px 4px calc(56px + env(safe-area-inset-bottom));max-width:62ch}

/* item view */
.view{position:fixed;inset:0;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:10}
.view.open{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{position:sticky;top:0;z-index:3;background:rgba(238,235,230,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:max(4px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 4px max(12px,env(safe-area-inset-left));min-height:52px}
.bar .back{font-weight:400;font-size:17px;min-height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--navy);border-radius:10px}
.bar .back svg{width:11px;height:19px}
.bar .meta{color:var(--muted);font-size:13px;margin-left:auto;text-align:right;line-height:1.35}
.inner{max-width:680px;margin:0 auto;padding:28px var(--pad) calc(80px + env(safe-area-inset-bottom))}
h2{font-family:var(--sysd);font-weight:700;font-size:clamp(24px,4.4vw,28px);line-height:1.15;letter-spacing:-.02em;margin:36px 0 12px}
h3{font-weight:600;font-size:17px;margin:24px 0 10px}
.lede{font-family:var(--sysd);font-weight:700;font-size:clamp(34px,6vw,48px);line-height:1.06;letter-spacing:-.028em;margin:6px 0 18px}
.inner p{margin-bottom:1em}
.group{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.group > div{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.group > div:last-child{border-bottom:0}
.group .dot{width:12px;height:12px;margin-top:6px}
.group b,.group dt{display:block;font-weight:600}
.group dd{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;font-weight:600;font-size:17px;text-decoration:none;border-radius:var(--r-btn)}
.btn.p{background:var(--navy);color:#fff}
.btn.s{background:rgba(29,76,91,.1);color:var(--navy)}
.btn.w{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.checks{list-style:none;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks li::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;margin-top:2px;box-shadow:inset 0 0 0 1.5px var(--navy)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);background:rgba(31,34,34,.06);padding:5px 10px;border-radius:999px}

/* instagram */
.igwrap{display:flex;gap:48px;justify-content:center;align-items:flex-start;padding:24px var(--pad) 48px}
.phone{flex:none;height:min(852px,calc(100dvh - 104px));min-height:560px;aspect-ratio:393/852;border-radius:clamp(40px,6.6vh,56px);background:#111;padding:clamp(9px,1.4vh,12px);box-shadow:0 30px 60px rgba(31,34,34,.18)}
.screen{width:100%;height:100%;border-radius:clamp(31px,5.2vh,44px);overflow:hidden;background:#fff;position:relative}
.side{width:360px;flex:none;position:sticky;top:76px}
.side .card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:20px}
.side h2{margin:12px 0 2px}
.pager{display:flex;gap:10px;margin-top:14px}
.pager .btn{flex:1;min-width:0;font-size:15px;padding:0 12px}
.pager .btn[disabled]{opacity:.35;pointer-events:none}
.ig{background:#fff;color:#000;height:100%;overflow-y:auto;font-family:var(--sys);font-size:14px;line-height:1.35;letter-spacing:0}
.ig .sbar{height:50px}
.ig .tbar{display:flex;align-items:center;height:44px;padding:0 12px;font-weight:700;font-size:16px;border-bottom:1px solid #efefef}
.ig .tbar button{width:44px;height:44px;display:grid;place-items:center;margin-left:-10px}
.ig .tbar span{flex:1;text-align:center;margin-right:34px}
.ig .ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ig .av{width:32px;height:32px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.ig .av .ig .ph b{font-size:14px} .ig .ph .more{margin-left:auto;font-weight:700;letter-spacing:1px}
.ig .car{position:relative}
.ig .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;container-type:inline-size;scroll-behavior:smooth}
.ig .track::-webkit-scrollbar{display:none}
.ig .pill{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 9px;border-radius:12px}
.ig .arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;display:none;place-items:center}
.ig .arr i{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.2);display:grid;place-items:center}
.ig .arr svg{width:10px;height:14px}
.ig .arr.prev{left:2px} .ig .arr.next{right:2px}
@media(hover:hover) and (pointer:fine){ .ig .arr{display:grid} }
.ig .acts{display:flex;align-items:center;gap:14px;padding:8px 12px 4px;position:relative}
.ig .acts svg{width:26px;height:26px}
.ig .acts .bm{margin-left:auto}
.ig .dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.ig .dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}
.ig .dots i.on{background:#0095f6}
.ig .cap{padding:4px 12px 4px;white-space:pre-wrap}
.ig .cap b{margin-right:4px}
.ig .when{padding:6px 12px 30px;color:#737373;font-size:12px}
.ig .fb{padding:18px 16px calc(40px + env(safe-area-inset-bottom));background:var(--paper);font-family:var(--sys);font-size:17px;color:var(--ink);letter-spacing:-.022em}
.ig .fb .card{background:var(--card);border-radius:var(--r-card);padding:18px}

/* slides: 4:5, sized off the carousel width so type scales with the phone. Brand type lives here. */
.slide{flex:none;width:100%;aspect-ratio:4/5;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;padding:9cqw 9cqw 17cqw;font-family:var(--brand);letter-spacing:.01em;overflow:hidden}
.slide .t{font-weight:600;font-size:8cqw;line-height:1.08;letter-spacing:-.035em}
.slide .t.s{font-size:6.2cqw;line-height:1.14}
.slide .t b{font-weight:600}
.slide .q{font-weight:300;font-size:6.4cqw;line-height:1.25}
.slide .who{font-weight:500;font-size:3.6cqw;margin-top:6cqw;opacity:.85}
.slide .foot{position:absolute;left:9cqw;right:9cqw;bottom:7cqw;display:flex;align-items:center;justify-content:space-between;font-size:3.2cqw;font-weight:500;letter-spacing:.06em;opacity:.85}
.slide .foot .slide .bigmark{width:24cqw;margin-bottom:7cqw}
.slide.photo{justify-content:flex-end;padding-bottom:20cqw}
.slide.photo .pl{font-weight:600;font-size:3.2cqw;letter-spacing:.14em;margin-bottom:3cqw;text-transform:uppercase}
.slide.photo .pd{font-weight:300;font-size:5.2cqw;line-height:1.3;max-width:88%}
.slide.photo::before{content:"";position:absolute;inset:6cqw;border-radius:3cqw;border:1px solid currentColor;opacity:.3}

@media(max-width:899px){
  .igwrap{flex-direction:column;align-items:center;gap:24px}
  .side{position:static;width:100%;max-width:520px}
}
@media(max-width:599px){
  .view.igmode .bar{display:none}
  .igwrap{display:block;padding:0}
  .phone{height:auto;min-height:0;aspect-ratio:auto;border-radius:0;background:none;padding:0;box-shadow:none}
  .screen{border-radius:0;overflow:visible}
  .ig{height:auto;overflow:visible;min-height:100vh}
  .ig .sbar{height:env(safe-area-inset-top)}
  .side{display:none}
}
@media(min-width:600px){ .ig .fb{display:none} .ig .tbar button{visibility:hidden} }
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}


/* ---------- Damaso additions ---------- */
.k-street{--c:var(--navy)} .k-deal{--c:var(--gold)} .k-people{--c:#D2A98F} .k-life{--c:var(--olive)} .k-ontherecord{--c:#8A8F96} .k-plan{--c:var(--navy)} .k-other{--c:#C9C9C9}
.wordmark{font-family:var(--brand);font-weight:700;font-size:22px;letter-spacing:-.04em;color:var(--navy)}
.wm{font-family:var(--brand);font-weight:700;letter-spacing:-.05em;line-height:1}
.ig .av{background:var(--navy);color:var(--paper);font-size:12px}
.slide .foot .wm{font-size:4cqw}
.slide .wm.big{font-size:16cqw;margin-bottom:7cqw}
.slide.img{padding:0;justify-content:flex-end}
.slide.img .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,34,49,0) 45%,rgba(25,34,49,.78) 100%)}
.slide.img .over{position:relative;z-index:1;padding:0 9cqw 17cqw;color:var(--paper)}
.slide.img .foot{z-index:1;color:var(--paper)}
.slide .ask{font-size:3.6cqw;line-height:1.35;margin:0;border-radius:2cqw;padding:3cqw 3.4cqw}
.month{margin-top:28px}
.month:first-child{margin-top:0}
.mname{font-family:var(--sysd);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0 0 12px}
.cal.list{padding:0}
.tag{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px;color:var(--muted);margin:0}
.st{margin-left:auto;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.st-ok{background:#E3EFE3;color:#2F5B33} .st-draft{background:var(--ask-bg);color:var(--ask)} .st-todo{background:#ECEDEF;color:var(--muted)}
.article .cover{border-radius:var(--r-card);overflow:hidden;aspect-ratio:16/9;margin-bottom:18px;background:var(--line)}
.article .cover img{width:100%;height:100%;object-fit:cover;display:block}
.atitle{font-family:var(--brand);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.04;letter-spacing:-.04em;margin:14px 0 8px;text-wrap:balance}
.asub{font-family:var(--brand);font-size:20px;line-height:1.3;letter-spacing:-.02em;color:var(--ink);opacity:.8;margin:0}
.article .when{margin-top:10px;font-size:15px}
.excerpt{margin-top:22px;padding:20px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);font-family:var(--brand);font-size:18px;line-height:1.55;letter-spacing:-.01em}
.excerpt p+p{margin-top:12px}
#mlist{display:none}
@media(max-width:899px){ #months{display:none} #mlist{display:block} }
</style>

<style>
.pp-gate { --pp-bg: #192231; --pp-fg: #F4F4F4; --pp-accent: #C0B283; position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; padding: 24px; background: var(--pp-bg); color: var(--pp-fg); font-family: "Schibsted Grotesk", -apple-system, sans-serif; opacity: 0; transition: opacity .4s ease; }
.pp-gate.ready { opacity: 1; }
.pp-gate__bg { position: absolute; inset: 0; background: url("/images/brandscript/hero-879-dusk.jpg") center / cover no-repeat; opacity: 0.35; }
.pp-gate__bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, var(--pp-bg)); }
.pp-card { position: relative; width: 100%; max-width: 400px; }
.pp-label { display: block; margin-bottom: 14px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--pp-accent); }
.pp-card h1 { margin: 0; font-size: clamp(40px, 11vw, 60px); line-height: .95; letter-spacing: -.05em; font-weight: 700; }
.pp-card p { margin: 14px 0 0; font-size: 16px; line-height: 1.5; opacity: .82; }
.pp-form { margin-top: 28px; display: grid; gap: 12px; }
.pp-form input[type=password] { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; color: #192231; background: #f4f4f4; border: 0; border-radius: 999px; padding: 15px 20px; outline: none; }
.pp-form input[type=password]:focus-visible { box-shadow: 0 0 0 3px var(--pp-accent); }
.pp-form button { font: inherit; font-weight: 600; font-size: 16px; border: 0; border-radius: 999px; padding: 15px 20px; background: var(--pp-accent); color: #192231; cursor: pointer; }
.pp-form button:disabled { opacity: .6; }
.pp-keep { display: flex; align-items: center; gap: 10px; font-size: 14px; opacity: .78; }
.pp-keep input { width: 18px; height: 18px; accent-color: var(--pp-accent); }
.pp-msg { min-height: 1.4em; margin: 0 !important; font-size: 14px !important; }
.pp-msg--err { color: var(--pp-accent); opacity: 1 !important; }
.pp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
<script src="/calendar/gate-d.js"></script>
</head>
<body>
<div class="pp-gate" id="pp-gate" role="dialog" aria-modal="true" aria-labelledby="pp-title">
  <div class="pp-gate__bg" aria-hidden="true"></div>
  <div class="pp-card">
    
    <h1 id="pp-title">Content calendar</h1>
    <p>For Damaso. Enter the password Iván sent you.</p>
    <form class="pp-form" id="pp-form" autocomplete="off">
      <label class="pp-sr" for="pp-pw">Password</label>
      <input type="password" id="pp-pw" placeholder="Password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button type="submit">Open</button>
      <label class="pp-keep"><input type="checkbox" id="pp-keep" checked> Remember this device</label>
      <p class="pp-msg" id="pp-msg" aria-live="polite"></p>
    </form>
  </div>
